# Deploy gulumen-webshop service on push (NOT dynamic-perfection).
# Setup once: Railway → gulumen-webshop → Settings → Tokens → Create project token
# GitHub → repo Settings → Secrets → Actions → RAILWAY_TOKEN
name: Deploy gulumen-webshop to Railway

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to gulumen-webshop (build + deploy)
        run: railway up --service gulumen-webshop --ci -y -m "GitHub Actions deploy ${GITHUB_SHA}"
