# Deploy gulumen-webshop service on push to master/main.
#
# Elsődleges út: Railway Dashboard → gulumen-webshop → Settings → Source
#   → GitHub repo + branch: master (automatikus deploy push után).
#   www.gulumen.com. Ne cseréld a branchet stagingre, ne a service nevet.
#
# Opcionális CLI deploy: állítsd be a RAILWAY_TOKEN secretet
#   Railway → gulumen-webshop → Settings → Tokens → Create project token
#   GitHub → Settings → Secrets → Actions → RAILWAY_TOKEN
#
# Staging (admin/auth kapu): docs/STAGING.md
#   külön service gulumen-webshop-staging + .github/workflows/railway-staging.yml
#   Ez a fájl szándékosan NEM használ `environment: production`-t, hogy
#   egy üres/protected GitHub Environment ne várakoztassa / ne látszódjon
#   kapunak, amíg a Railway Source továbbra is azonnal deployol.
name: Deploy gulumen-webshop to Railway

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check RAILWAY_TOKEN
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RAILWAY_TOKEN nincs beállítva – a CLI railway up kihagyva."
            echo "Ha a gulumen-webshop service GitHub Source-ja a master/main branch,"
            echo "a Railway automatikusan elindítja a deployt ebből a pushból."
            echo "CLI deployhoz: Railway → Tokens → GitHub Actions secret: RAILWAY_TOKEN"
            exit 0
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via Railway CLI
        if: steps.token.outputs.has_token == 'true'
        uses: docker://ghcr.io/railwayapp/cli:latest
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          args: >-
            up --service gulumen-webshop --ci -y
            -m "GitHub Actions deploy ${{ github.sha }}"
