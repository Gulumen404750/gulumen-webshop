name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / Lint / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Typecheck
        run: npm run typecheck

  npm-audit:
    name: npm audit (high / critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Meglévő high/critical advisory-k látszanak (piros job), de nem blokkolják a többi CI-t.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full production audit report (non-blocking below high)
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Fail on high and critical production advisories
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true
          # Playwright webServer also sets these; kept here for clarity / direct runs.
          DATABASE_URL: ''
          STRIPE_SECRET_KEY: ''
          JWT_SECRET: e2e-test-jwt-secret-minimum-32-chars-long
          PAYMENTS_WEBHOOK_SECRET: e2e-webhook-secret

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
