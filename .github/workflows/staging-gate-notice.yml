# Figyelmeztetés admin/auth PR-eknél, ha a célág main vagy master.
# Soha nem fail (nem required check). A www deploy ettől nem áll le.
# Folyamat: docs/STAGING.md
name: Staging gate notice

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/app/admin/**'
      - 'src/app/api/admin/**'
      - 'src/app/api/auth/**'
      - 'src/lib/admin*.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/auth-options.ts'
      - 'src/middleware.ts'
      - 'prisma/schema.prisma'

jobs:
  notice:
    name: Remind staging before www
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notice
        run: |
          echo "::warning::Admin/auth változás a main/master felé. Először staging (docs/STAGING.md), ne egyből a www.gulumen.com-ra. Ez a job nem bukik, az éles Railway deploy nem áll le."
