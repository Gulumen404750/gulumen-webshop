<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobil előnézet – valódi telefon méretek</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e5e5e5;
      min-height: 100vh;
      padding: 12px;
    }
    .toolbar {
      max-width: 420px;
      margin: 0 auto 12px;
      padding: 12px;
      background: #262626;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .toolbar label {
      font-size: 0.8rem;
      color: #a3a3a3;
      display: block;
      margin-bottom: 4px;
    }
    .toolbar select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #404040;
      background: #171717;
      color: #fafafa;
      font-size: 0.9rem;
      min-width: 180px;
    }
    .toolbar .group {
      display: flex;
      flex-direction: column;
    }
    .toolbar .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar input[type="range"] {
      width: 100px;
      accent-color: #3b82f6;
    }
    .toolbar .val {
      font-size: 0.8rem;
      color: #a3a3a3;
      min-width: 3rem;
    }
    .phone-frame {
      margin: 0 auto;
      background: #000;
      border-radius: 32px;
      padding: 12px;
      box-shadow: 0 0 0 2px #333, 0 25px 50px -12px rgba(0,0,0,0.5);
      position: relative;
    }
    .phone-frame.has-notch::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 28px;
      background: #000;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }
    .viewport {
      background: #f5f5f5;
      color: #1a1a1a;
      border-radius: 20px;
      overflow: hidden;
      min-height: 500px;
      margin: 0 auto;
    }
    .viewport-inner {
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      min-height: 400px;
    }
    .demo-image-wrap {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      overflow: hidden;
      position: relative;
    }
    .demo-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .demo-thumbs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .demo-thumb {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
      overflow: hidden;
      background: #f3f4f6;
    }
    .demo-thumb.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
    }
    .demo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .demo-title { font-size: 1.25rem; margin: 12px 0 0; font-weight: 600; }
    .demo-hint { font-size: 0.75rem; color: #6b7280; margin-top: 8px; }
    .css-hint {
      max-width: 420px;
      margin: 12px auto 0;
      padding: 10px 12px;
      background: #262626;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #a3a3a3;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="group">
      <label>Készülék (valódi méret)</label>
      <select id="device">
        <optgroup label="Apple">
          <option value="375">iPhone SE (2nd/3rd) — 375×667</option>
          <option value="390">iPhone 14 / 13 / 12 — 390×844</option>
          <option value="393">iPhone 14 Pro — 393×852</option>
          <option value="428">iPhone 14 Plus — 428×926</option>
          <option value="430">iPhone 14 Pro Max — 430×932</option>
        </optgroup>
        <optgroup label="Android">
          <option value="360">Samsung Galaxy S20 / S21 — 360×800</option>
          <option value="384">Samsung Galaxy S21 Ultra — 384×854</option>
          <option value="393">Google Pixel 5 — 393×851</option>
          <option value="412">Google Pixel 6/7 — 412×915</option>
          <option value="412">OnePlus 9 — 412×919</option>
        </optgroup>
        <optgroup label="Egyéb">
          <option value="320">Kicsi (320px)</option>
          <option value="375">Közepes (375px)</option>
          <option value="414">Nagy (414px)</option>
        </optgroup>
      </select>
    </div>
    <div class="group">
      <label>Oldalpadding (px)</label>
      <div class="row">
        <input type="range" id="padding" min="0" max="32" value="16">
        <span class="val" id="paddingVal">16px</span>
      </div>
    </div>
    <div class="group">
      <label>Notch (iPhone)</label>
      <input type="checkbox" id="notch" checked>
    </div>
  </div>

  <div class="phone-frame" id="frame">
    <div class="viewport" id="viewport">
      <div class="viewport-inner" id="viewportInner">
        <div class="demo-image-wrap">
          <img src="https://placehold.co/600x600/f3f4f6/9ca3af?text=Termék+kép" alt="Termék kép">
        </div>
        <div class="demo-thumbs">
          <div class="demo-thumb active"><img src="https://placehold.co/80x80/e5e7eb/d1d5db?text=1" alt=""></div>
          <div class="demo-thumb"><img src="https://placehold.co/80x80/e5e7eb/d1d5db?text=2" alt=""></div>
          <div class="demo-thumb"><img src="https://placehold.co/80x80/e5e7eb/d1d5db?text=3" alt=""></div>
        </div>
        <div class="demo-title">Termék neve</div>
        <p class="demo-hint">Ezt a méretet látod a kiválasztott telefonon. Ha elcsúszik valami, növeld az „Oldalpadding” értéket, majd a valódi oldalon használd ugyanazt (pl. px-4 = 16px).</p>
      </div>
    </div>
  </div>

  <div class="css-hint" id="cssHint">
    Viewport: <span id="wVal">390</span>px · Padding: <span id="pVal">16</span>px · A termékoldalon: max-w-7xl mx-auto px-4 (vagy px-[<span id="pVal2">16</span>px])
  </div>

  <script>
    var device = document.getElementById('device');
    var padding = document.getElementById('padding');
    var notch = document.getElementById('notch');
    var frame = document.getElementById('frame');
    var viewport = document.getElementById('viewport');
    var viewportInner = document.getElementById('viewportInner');
    var paddingVal = document.getElementById('paddingVal');
    var wVal = document.getElementById('wVal');
    var pVal = document.getElementById('pVal');
    var pVal2 = document.getElementById('pVal2');
    var cssHint = document.getElementById('cssHint');

    function update() {
      var w = parseInt(device.value, 10);
      var p = parseInt(padding.value, 10);
      viewport.style.width = w + 'px';
      viewportInner.style.paddingLeft = p + 'px';
      viewportInner.style.paddingRight = p + 'px';
      paddingVal.textContent = p + 'px';
      wVal.textContent = w;
      pVal.textContent = p;
      pVal2.textContent = p;
      frame.classList.toggle('has-notch', notch.checked && w >= 390);
    }
    device.addEventListener('change', update);
    padding.addEventListener('input', update);
    notch.addEventListener('change', update);
    update();
  </script>
</body>
</html>
