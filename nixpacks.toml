# Railway / Nixpacks: build a projekt gyökeréből futtatva
# így a next build megtalálja a src/app mappát
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

# Start: scripts/start.js → prisma migrate deploy + next start (NO seed, NO reset)
[start]
cmd = "npm run start"
