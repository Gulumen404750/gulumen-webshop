# Railway deploy – CSAK a gulumen-webshop service-re (www.gulumen.com).
# Használat (egyszeri login után):
#   npx @railway/cli login
#   npx @railway/cli link
#     → welcoming-balance projekt
#     → gulumen-webshop service  (NE dynamic-perfection!)
#   npm run deploy:railway
#
# Vagy GitHub Actions: állítsd be a RAILWAY_TOKEN secretet (Railway → gulumen-webshop → Settings → Tokens).
# Redeploy trigger: admin avatar thumbnails + lightbox 2026-08-20T21:25.

[build]
builder = "nixpacks"
buildCommand = "npm run build"
# Force deploy on any code change (dashboard Watch Paths was skipping master commits).
watchPatterns = ["**/**"]

[deploy]
startCommand = "npm run start"
# Liveness only – DB blip ne indítson restart loopot. Readiness: /api/health/ready
healthcheckPath = "/api/health/live"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[env]
HOSTNAME = "0.0.0.0"
NEXT_PUBLIC_APP_URL = "https://www.gulumen.com"
NEXTAUTH_URL = "https://www.gulumen.com"
# Ügyfélszolgálat megjelenítés (mailto szöveg). Beérkező / admin értesítő:
# postmaster@gulumen.com + ADMIN_EMAIL (Gmail), mert a gulumen.com-nak jelenleg nincs MX-e.
NEXT_PUBLIC_SUPPORT_EMAIL = "postmaster@gulumen.com"
NEXT_PUBLIC_LEGAL_EMAIL = "postmaster@gulumen.com"
# ORDER_SUPPORT_EMAIL opcionális. ADMIN_EMAIL-t állítsd Gmailre (Railway Variables),
# különben a módosítási figyelmeztetések és admin másolatok nem érkeznek meg.
